<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tom na Voz">
<meta name="theme-color" content="#E4E0D6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Tom na Voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: um aparelho só — visor escuro com 1 ou 2 campos de tom, medidor de 12 notas, teclas em pílula embaixo */
:root{
  --bg:#E4E0D6; --surface:#EEEBE3; --ink:#1E1D1A; --muted:#77736A; --line:#CFCABE;
  --accent:#EE6A1F; --accent-ink:#FFF6EE;
  --display:#1C1B19; --display-ink:#EFEADF; --display-dim:#6E6A62;
  --hi:rgba(255,255,255,.75); --lo:rgba(60,50,30,.16);
  --f-ui:"Archivo",system-ui,-apple-system,sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191917; --surface:#232220; --ink:#ECE7DC; --muted:#8C877D; --line:#34322E;
  --display:#0E0E0D; --display-ink:#F1ECE1; --display-dim:#5E5A53;
  --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191917; --surface:#232220; --ink:#ECE7DC; --muted:#8C877D; --line:#34322E;
  --display:#0E0E0D; --display-ink:#F1ECE1; --display-dim:#5E5A53;
  --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.dev{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin:0}
h1 span{color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.screen{background:var(--display);color:var(--display-ink);border-radius:14px;padding:16px;
  box-shadow:inset 2px 2px 6px rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.04);display:flex;flex-direction:column;gap:14px}
.status{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--display-dim)}
.status b{color:var(--display-ink);font-weight:500}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--display-dim);margin-right:7px;vertical-align:1px}
.led.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.one{grid-template-columns:1fr}
.field{border:1px solid #33312D;border-radius:9px;padding:12px 12px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.field .k{font-family:var(--f-mono);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.02em}
.fields.one .field .k{font-size:64px;color:var(--accent)}
.field .n{font-size:13px;color:var(--display-dim)}
.field .n strong{color:var(--display-ink);font-weight:500}
.field.empty .k{color:var(--display-dim)}
.field.fav{border-color:var(--accent)}
.fv{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.screen.locked .fields.one .field{background:var(--accent);border-color:var(--accent);transition:background .25s}
.screen.locked .fields.one .field .k,.screen.locked .fields.one .field .n strong{color:var(--accent-ink)}
.screen.locked .fields.one .field .n{color:rgba(255,246,238,.75)}
.screen.locked .fields.one .field .fv{color:var(--accent-ink)}
.screen.locked .status b{color:var(--accent)}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.scale span{padding:3px 7px;border-radius:5px;background:#2A2825;color:var(--display-ink)}
.scale span.hit{background:var(--accent);color:var(--accent-ink)}
.scale span.t{box-shadow:inset 0 0 0 1.5px var(--display-ink)}
.more{font-family:var(--f-mono);font-size:11px;color:var(--display-dim);letter-spacing:.06em}

.tuner{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border-top:1px solid #33312D;padding-top:12px}
.now-note{font-family:var(--f-mono);font-size:28px;font-weight:500;text-align:center;line-height:1}
.now-note.ok{color:var(--accent)}
.ref{font-family:var(--f-mono);font-size:10px;color:var(--display-dim);text-align:center;margin-top:6px;letter-spacing:.04em}
.dial{position:relative;height:38px}
.ticks{position:absolute;inset:0 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
.ticks i{width:1px;height:8px;background:var(--display-dim)}
.ticks i.mid{height:16px;background:var(--display-ink)}
.needle{position:absolute;bottom:14px;width:2px;height:24px;margin-left:-1px;background:var(--display-ink);border-radius:1px;left:50%;transition:left .08s linear;opacity:.25}
.needle.on{opacity:1}.needle.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dial-lbl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--display-dim)}
.cents{color:var(--display-ink)}

.chroma{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.chroma button{font:500 14px var(--f-mono);color:var(--ink);border:0;border-radius:10px;padding:12px 0;cursor:pointer;
  background:linear-gradient(100deg,var(--surface),var(--bg));box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),2px 3px 6px var(--lo)}
.chroma button.blk{background:linear-gradient(100deg,#3A3834,#24221F);color:#E8E3D8}
.chroma button.on{background:var(--accent);color:var(--accent-ink);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),0 0 10px rgba(238,106,31,.4)}
.chroma button.pass{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.passrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.passrow i{font-style:normal;display:inline-block;width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--accent);vertical-align:-3px;margin-right:6px}
.passrow button{all:unset;cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.chroma button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chroma-lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.chroma-lbl button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0;text-align:center;min-height:2.9em;text-wrap:balance}
.mic{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;margin:6px auto 0;display:grid;place-items:center;color:var(--accent-ink);
  background:radial-gradient(circle at 35% 30%,#FB9455,var(--accent) 60%);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.15),4px 6px 14px var(--lo),0 0 0 9px var(--surface),0 0 0 10px var(--line)}
.mic svg{width:40px;height:40px}
.mic:active{transform:translateY(1px)}
.mic:focus-visible{outline:2px solid var(--accent);outline-offset:14px}
.mic.on{background:radial-gradient(circle at 35% 30%,#3A3834,#1C1B19 65%);color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),4px 6px 14px var(--lo),0 0 0 9px var(--surface),0 0 0 14px var(--accent)}}
.alt{position:relative;align-self:center;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
@media (prefers-reduced-motion:reduce){.needle{transition:none}.mic.on{animation:none}}
</style>

</head>
<body>
<div class="dev">
  <header><h1>Tom na Voz<span>.</span></h1><span class="tag">só tons maiores</span></header>

  <section class="screen" id="screen" aria-live="polite">
    <div class="status"><span><span class="led" id="led"></span><b id="stat">Pronto</b></span><span id="count">—</span></div>
    <div class="fields" id="fields"></div>
    <div class="tuner">
      <div><div class="now-note" id="nowNote">–</div><div class="ref" id="refLbl">A 440</div></div>
      <div class="dial"><div class="ticks"><i></i><i></i><i></i><i></i><i class="mid"></i><i></i><i></i><i></i><i></i></div>
        <div class="needle" id="needle"></div>
        <div class="dial-lbl"><span>♭ −50</span><span class="cents" id="cents">&nbsp;</span><span>+50 ♯</span></div></div>
    </div>
  </section>

  <div class="chroma-lbl"><span>Notas ouvidas · segure para apagar</span><button type="button" id="clearBtn">limpar</button></div>
  <div class="chroma" id="chroma"></div>
  <div class="passrow"><span><i></i>nota de passagem, fora da conta</span><button type="button" id="passBtn">ligado</button></div>
  <div class="passrow"><span>Captação</span><button type="button" id="polyBtn">melodia</button></div>

  <button class="mic" id="micBtn" type="button" aria-label="Ouvir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <p class="note" id="msg">Toque no microfone e cante. Ele para sozinho quando achar o tom.</p>
</div>

<script>
const PC=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const KEYS=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const PT=['Dó','Ré♭','Ré','Mi♭','Mi','Fá','Fá♯','Sol','Lá♭','Lá','Si♭','Si'];
const MAJ=[0,2,4,5,7,9,11];
const PROF=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const $=id=>document.getElementById(id);
/* sem zoom: pinça e dois toques */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<320)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

let curF=0,cSm=null;
/* referência automática: desvio médio da afinação (em semitons) e trava de nota (histerese) */
let REF=0,refS=0,refC=0,refW=0,lockN=null;
function refLearn(raw,w,dt){const d=raw-Math.round(raw);refS+=Math.sin(2*Math.PI*d)*w*dt;refC+=Math.cos(2*Math.PI*d)*w*dt;refW+=w*dt;
  if(refW>.5)REF=Math.max(-.45,Math.min(.45,Math.atan2(refS,refC)/(2*Math.PI)))}
let POLY=false;try{POLY=localStorage.getItem('tnv-poly')==='1'}catch(e){}
let hist=new Array(12).fill(0), current=-1, seen=new Set(), runM=null, runT=0;
let att=new Array(12).fill(0), ends=new Array(12).fill(0), lastStable=-1, firstNote=-1, trans=new Array(144).fill(0), lastAt=new Array(12).fill(-9), firstAt=new Array(12).fill(-1), atkN=0, excluded=new Set(), silT=0, endMarked=false, counted=false;
/* nota só entra quando fica firme: ±45 cents do centro por ~80 ms
   (um quadro fora da faixa não zera a contagem, só desconta um pouco).
   Glissando, apojatura e escorregão da voz passam sem contar;
   conta ataques e marca fim de frase depois de 0,35 s de silêncio */
function feed(m,dt,conf=1,mf=null){
  if(m==null){runM=null;runT=0;current=-1;silT+=dt;
    if(silT>=0.35&&lastStable>=0&&!endMarked){ends[lastStable]++;endMarked=true}return}
  silT=0;
  const pc=((m%12)+12)%12;current=pc;
  const dev=mf!=null?Math.abs(mf-m)*100:(curF>0?Math.abs(1200*Math.log2(curF/440)-100*(m-69)):99);
  if(m!==runM){runM=m;runT=0;counted=false}
  runT=dev<50?runT+dt*conf:Math.max(0,runT-dt*.5);
  hist[pc]+=dt*conf;
  if(runT>=0.08){seen.add(pc);if(!counted){if(lastStable>=0&&lastStable!==pc)trans[lastStable*12+pc]++;att[pc]++;lastAt[pc]=++atkN;if(firstAt[pc]<0)firstAt[pc]=atkN;counted=true;lastStable=pc;endMarked=false;if(firstNote<0)firstNote=pc}}
}

/* ---------- decisão do tom ---------- */
const inKey=(k,pc)=>MAJ.includes((pc-k+12)%12);
function corr(k){
  const x=[...Array(12)].map((_,i)=>hist[(i+k)%12]);
  const mx=x.reduce((a,b)=>a+b)/12, my=PROF.reduce((a,b)=>a+b)/12;
  let n=0,dx=0,dy=0;for(let i=0;i<12;i++){const a=x[i]-mx,b=PROF[i]-my;n+=a*b;dx+=a*a;dy+=b*b}
  return dx&&dy?n/Math.sqrt(dx*dy):0;
}
/* peso por grau: tônica, quinta e terça puxam; a sensível no fim pede resolução */
const DW={0:1,7:.7,4:.6,11:.1}, EW={0:1,4:.7,7:.6,11:-.8}, FW={0:1,7:.6,4:.4};
function score(k){
  let a=0,at=0,e=0,et=0;
  for(let p=0;p<12;p++){const d=(p-k+12)%12;
    if(att[p]){a+=att[p]*(DW[d]??.3);at+=att[p]}
    if(ends[p]){e+=ends[p]*(EW[d]??0);et+=ends[p]}}
  if(lastStable>=0){e+=EW[(lastStable-k+12)%12]??0;et+=1}
  const fw=firstNote>=0?(FW[(firstNote-k+12)%12]??0):0;
  const rs=resol(k);
  return corr(k)+.5*(at?a/at:0)+.8*(et?e/et:0)+.4*fw+.6*(rs.t?rs.r/rs.t:0);
}
/* movimentos de resolução: sensível→tônica, 4ª→3ª, 2ª→tônica, 5ª→tônica */
const RW={'11,0':1,'5,4':.8,'2,0':.5,'7,0':.5};
function resol(k){let r=0,t=0,n=0;
  for(let a=0;a<12;a++)for(let b=0;b<12;b++){const v=trans[a*12+b];if(!v)continue;t+=v;
    const w=RW[((a-k+12)%12)+','+((b-k+12)%12)]??0;r+=v*w;if(w>0)n+=v}
  return {r,t,n};
}
/* evidência de contexto a favor de k: fins de frase em repouso + resoluções + última nota estável */
function evidence(k){let e=resol(k).n;
  for(let p=0;p<12;p++)if(ends[p]&&(EW[(p-k+12)%12]??0)>0)e+=ends[p];
  if(lastStable>=0&&(EW[(lastStable-k+12)%12]??0)>0)e++;
  return e;
}
function significant(){return [...seen].sort((a,b)=>a-b)}
/* módulo "notas de passagem": nota fora da escala conta enquanto é recente;
   se ela está fora da escala que a maioria aponta, apareceu no máximo 2 vezes
   e já vieram 2 notas depois dela, sai da conta (fica só contornada no teclado).
   Se voltar a aparecer, conta de novo. */
let PASS=true;try{PASS=localStorage.getItem('tnv-pass')!=='0'}catch(e){}
const fits=set=>[...Array(12).keys()].some(k=>set.every(p=>inKey(k,p)));
function passFilter(sig){
  let ex=[];
  if(PASS&&!fits(sig)){
    // compara com a escala que a maioria das notas já aponta: as notas de fora
    // que apareceram no máximo 2 vezes e já ficaram 2 notas para trás são apagadas
    const old=p=>att[p]<=2&&atkN-lastAt[p]>=2;
    let best=null;
    for(let k=0;k<12;k++){
      // escala da maioria: a que deixa menos ataques de fora
      const out=sig.filter(p=>!inKey(k,p)),w=out.reduce((t,p)=>t+att[p],0),sc=score(k);
      if(!best||w<best.w||(w===best.w&&sc>best.sc))best={out,w,sc};
    }
    // só apaga se todas as notas de fora já forem antigas; se alguma é recente, ainda conta
    if(best&&best.out.length<=2&&best.out.every(old)){ex=best.out;sig=sig.filter(p=>!ex.includes(p))}
  }
  excluded=new Set(ex);return sig;
}
function decide(){
  const sig=passFilter(significant());
  if(!sig.length) return {sig,keys:[],extra:0,approx:false};
  const cover=k=>sig.filter(p=>inKey(k,p)).length;
  const best=Math.max(...[...Array(12).keys()].map(cover));
  const approx=best<sig.length;
  let c=[...Array(12).keys()].filter(k=>cover(k)===best);
  c.sort((a,b)=>score(b)-score(a));
  let keys=c.slice(0,2),byContext=false,conf='';
  if(!approx&&c.length===2&&sig.length>=4){
    const gap=score(c[0])-score(c[1]);
    if(gap>=.6&&evidence(c[0])>=2){byContext=true;keys=[c[0]];
      const sp=spell(c[0]);conf=MAJ.map((iv,i)=>[(c[0]+iv)%12,sp[i]]).filter(x=>!inKey(c[1],x[0])).map(x=>x[1]).join(' ')}}
  return {sig,keys,extra:byContext?0:Math.max(0,c.length-2),approx,best,byContext,conf};
}
function outside(k){return [...seen].filter(p=>!excluded.has(p)&&!inKey(k,p)).map(p=>PC[p]).join(' ')}
function spell(k){
  const L='CDEFGAB',nat=[0,2,4,5,7,9,11];
  const li=L.indexOf(KEYS[k][0]);
  return MAJ.map((iv,i)=>{const l=(li+i)%7,t=(k+iv)%12;let d=(t-nat[l]+12)%12;if(d>6)d-=12;
    return L[l]+(d===1?'♯':d===-1?'♭':d===2?'𝄪':'')});
}

/* ---------- desenho ---------- */
function render(live){
  const r=decide(), f=$('fields');
  const inSet=new Set();r.keys.forEach(k=>MAJ.forEach(iv=>inSet.add((k+iv)%12)));
  for(let i=0;i<12;i++){const b=$('k'+i);if(b){b.classList.toggle('on',seen.has(i)&&!excluded.has(i));b.classList.toggle('pass',excluded.has(i))}}
  const nn=$('nowNote'),nd=$('needle');$('refLbl').textContent='A '+Math.round(440*2**(REF/12));
  if(current>=0&&curF>0){
    const c=1200*Math.log2(curF/440)-100*REF-100*(runM-69);cSm=cSm==null?c:cSm*.6+c*.4;
    const ok=Math.abs(cSm)<8;
    nn.textContent=PC[current];nn.classList.toggle('ok',ok);
    nd.style.left=(50+Math.max(-50,Math.min(50,cSm)))+'%';nd.className='needle on'+(ok?' ok':'');
    $('cents').textContent=(cSm>0?'+':'')+Math.round(cSm);
  }else{nn.textContent='–';nn.classList.remove('ok');nd.className='needle';cSm=null;$('cents').innerHTML='&nbsp;'}
  $('count').textContent=r.sig.length?`${r.sig.length} nota${r.sig.length>1?'s':''}`:'—';
  if(!r.keys.length){
    f.className='fields';f.innerHTML=`<div class="field empty"><div class="k">–</div><div class="n">ouvindo…</div></div><div class="field empty"><div class="k">–</div><div class="n">&nbsp;</div></div>`;
    $('stat').textContent=live?'Ouvindo':'Pronto';return;
  }
  if(r.keys.length===1){
    const k=r.keys[0];
    f.className='fields one';
    f.innerHTML=`<div class="field"><div class="k">${KEYS[k]}</div><div class="n"><strong>${PT[k]} maior</strong>${r.approx?' · '+outside(k)+' fora da escala':''}${r.byContext?' · pelo contexto<br><span class="fv">'+r.conf+' confirmaria</span>':''}</div></div>
      <div class="scale">${spell(k).map((s,i)=>`<span class="${seen.has((k+MAJ[i])%12)?'hit':''}${i?'':' t'}">${s}</span>`).join('')}</div>`;
    $('stat').textContent=r.approx?'Mais provável':r.byContext?'Definido pelo contexto':'Tom definido';
  }else{
    f.className='fields';
    f.innerHTML=r.keys.map((k,j)=>`<div class="field${j?'':' fav'}"><div class="k">${KEYS[k]}</div><div class="n"><strong>${PT[k]} maior</strong>${j?'':'<br><span class="fv">mais provável</span>'}${r.approx?'<br>'+outside(k)+' fora':''}</div></div>`).join('')
      +(r.extra?`<div class="more">+${r.extra} outro${r.extra>1?'s':''} possíve${r.extra>1?'is':'l'} · continue cantando</div>`:'');
    $('stat').textContent=r.approx?'Ambíguo · aproximado':'Ambíguo';
  }
}

/* ---------- teclado cromático (teste) ---------- */
const BLK=[1,3,6,8,10];
PC.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.textContent=p;b.id='k'+i;
  if(BLK.includes(i))b.className='blk';
  let hold=0,held=false;
  b.addEventListener('pointerdown',()=>{held=false;hold=setTimeout(()=>{held=true;seen.delete(i);hist[i]=0;att[i]=0;ends[i]=0;if(lastStable===i)lastStable=-1;if(firstNote===i)firstNote=-1;render(false)},500)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(hold)));
  b.onclick=()=>{if(held)return;audio();$('screen').classList.remove('locked');
    seen.add(i);hist[i]+=0.3;if(lastStable>=0&&lastStable!==i)trans[lastStable*12+i]++;att[i]++;lastAt[i]=++atkN;if(firstAt[i]<0)firstAt[i]=atkN;lastStable=i;if(firstNote<0)firstNote=i;endMarked=false;beep(60+i);current=-1;render(false)};
  $('chroma').appendChild(b)});
function beep(m){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=440*2**((m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.5)}
function passLbl(){$('passBtn').textContent=PASS?'passagem: ligado':'passagem: desligado'}passLbl();
$('passBtn').onclick=()=>{PASS=!PASS;try{localStorage.setItem('tnv-pass',PASS?'1':'0')}catch(e){}passLbl();render(false)};
function polyLbl(){$('polyBtn').textContent=POLY?'polifônico (várias notas)':'melodia (uma nota)'}polyLbl();
$('polyBtn').onclick=()=>{POLY=!POLY;try{localStorage.setItem('tnv-poly',POLY?'1':'0')}catch(e){}polyLbl();polyReset()};
$('clearBtn').onclick=()=>{stopAll();reset();render(false);$('msg').textContent='Limpo. Toque as notas ou use o microfone.'};

/* ---------- modo polifônico: várias notas ao mesmo tempo ----------
   olha os picos do espectro (80 Hz a 2 kHz), soma a força de cada uma das 12 notas;
   nota com pelo menos metade da força da mais forte, firme por 150 ms, conta como aparição */
const polyRun=new Array(12).fill(0),polyOn=new Array(12).fill(false);
function polyReset(){polyRun.fill(0);polyOn.fill(false)}
function polyFeed(spec,sr,dt,loud){
  const ch=new Array(12).fill(0);
  if(loud){
    const hz=sr/(spec.length*2),lo=Math.ceil(80/hz),hi=Math.min(spec.length-2,Math.floor(2000/hz));
    let top=-200;for(let i=lo;i<=hi;i++)if(spec[i]>top)top=spec[i];
    for(let i=lo;i<=hi;i++){const v=spec[i];
      if(v<top-30||v<=spec[i-1]||v<spec[i+1])continue;       // só picos fortes
      const a=spec[i-1],c=spec[i+1],d=a-2*v+c,off=d?(a-c)/(2*d):0;
      const mf=69+12*Math.log2((i+off)*hz/440)-REF,mr=Math.round(mf);
      if(Math.abs(mf-mr)>.3)continue;                        // fora do centro: não é nota
      ch[((mr%12)+12)%12]+=10**(v/20);
    }
  }
  const mx=Math.max(...ch);
  for(let p=0;p<12;p++){
    const on=mx>0&&ch[p]>=mx*.5;
    polyRun[p]=on?polyRun[p]+dt:Math.max(0,polyRun[p]-dt);
    if(on)hist[p]+=dt*ch[p]/mx;
    if(on&&polyRun[p]>=.15&&!polyOn[p]){polyOn[p]=true;seen.add(p);att[p]++;lastAt[p]=++atkN;if(firstAt[p]<0)firstAt[p]=atkN;if(firstNote<0)firstNote=p}
    if(polyRun[p]===0)polyOn[p]=false;
  }
}

/* ---------- detecção de altura (MPM, McLeod) ----------
   função de diferença normalizada; escolhe o primeiro pico com 90% do maior.
   "clarity" (0–1) diz o quanto a leitura é confiável */
function mpm(x0,sr){
  let rms=0;for(let i=0;i<x0.length;i++)rms+=x0[i]*x0[i];rms=Math.sqrt(rms/x0.length);
  const N=x0.length>>1,x=new Float32Array(N),s=sr/2;
  for(let i=0;i<N;i++)x[i]=(x0[2*i]+x0[2*i+1])*.5;
  const maxT=Math.min(N-2,Math.ceil(s/55)),minT=Math.max(2,Math.floor(s/1500));
  const n=new Float32Array(maxT+2);
  for(let t=0;t<=maxT+1;t++){let r=0,m=0;for(let i=0;i<N-t;i++){const a=x[i],b=x[i+t];r+=a*b;m+=a*a+b*b}n[t]=m?2*r/m:0}
  let pos=false,cm=-1,ct=0;const keys=[];
  for(let t=1;t<=maxT;t++){
    if(!pos&&n[t-1]<=0&&n[t]>0){pos=true;cm=-1}
    else if(pos&&n[t-1]>0&&n[t]<=0){pos=false;if(ct>=minT)keys.push(ct)}
    if(pos&&n[t]>cm){cm=n[t];ct=t}
  }
  if(pos&&cm>0&&ct>=minT)keys.push(ct);
  if(!keys.length)return {f:-1,clarity:0,rms};
  const top=Math.max(...keys.map(t=>n[t])),p=keys.find(t=>n[t]>=.9*top);
  const a=n[p-1],b=n[p],c=n[p+1],d=a-2*b+c,off=d?(a-c)/(2*d):0;
  return {f:s/(p+off),clarity:b,rms};
}

/* ---------- detecção de altura (YIN) ---------- */
function yin(buf,sr){
  const W=Math.floor(buf.length/2),tMin=Math.floor(sr/1000),tMax=Math.min(W-1,Math.ceil(sr/65));
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);
  const d=new Float32Array(tMax+1);
  for(let t=1;t<=tMax;t++){let s=0;for(let i=0;i<W;i++){const v=buf[i]-buf[i+t];s+=v*v}d[t]=s}
  let run=0;const c=new Float32Array(tMax+1);c[0]=1;
  for(let t=1;t<=tMax;t++){run+=d[t];c[t]=run?d[t]*t/run:1}
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){if(c[t]<0.18){while(t+1<=tMax&&c[t+1]<c[t])t++;tau=t;break}}
  if(tau<0) return {f:-1,rms};
  const a=c[tau-1]??c[tau],b=c[tau],e=c[tau+1]??c[tau],den=a+e-2*b;
  const tt=den?tau+(a-e)/(2*den):tau;
  return {f:sr/tt,rms};
}
const toMidi=f=>Math.round(69+12*Math.log2(f/440));
function median(a){const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]}

/* ---------- motor de tempo comum ---------- */
let ctx=null, loopId=0, stopFn=null;
function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')ctx.resume().catch(()=>{});return ctx}
function stopAll(){cancelAnimationFrame(loopId);if(stopFn){stopFn();stopFn=null}current=-1;$('led').classList.remove('on');
  $('micBtn').classList.remove('on');recording=false}
function reset(){$('screen').classList.remove('locked');REF=0;refS=refC=refW=0;lockN=null;hist.fill(0);att.fill(0);ends.fill(0);trans.fill(0);lastAt.fill(-9);firstAt.fill(-1);atkN=0;excluded.clear();lastStable=-1;firstNote=-1;silT=0;endMarked=false;counted=false;current=-1;seen.clear();runM=null;runT=0}
let lockKey=-1,lockT=0;
function found(t){ // tom isolado e estável por 0,5 s
  const r=decide();const k=r.keys.length===1&&!r.approx?r.keys[0]:-1;
  if(k!==lockKey){lockKey=k;lockT=t;return false}
  return k>=0&&t-lockT>=0.5;
}
function done(){stopAll();render(false);const k=decide().keys[0];
  $('screen').classList.add('locked');$('stat').textContent=(decide().byContext?'Pelo contexto':'Tom definido')+' · parei de ouvir';
  $('msg').textContent=`Achei: ${PT[k]} maior. Toque no microfone para ouvir outra melodia.`}
function runTimeline(midiAt,dur,label,onEnd){
  const t0=ctx.currentTime;let last=0;lockKey=-1;$('led').classList.add('on');
  const tick=()=>{const t=ctx.currentTime-t0;const dt=Math.min(t-last,.1);last=t;
    if(dt>0)feed(midiAt(t),dt);
    render(true);
    if(found(t)){done();return}
    if(t<dur)loopId=requestAnimationFrame(tick);else{stopAll();render(false);onEnd&&onEnd()}};
  $('stat').textContent=label;loopId=requestAnimationFrame(tick);
}

render(false);

/* ---------- microfone ---------- */
let recording=false;
/* o microfone é pedido uma vez e fica aberto enquanto o app está na tela;
   entre uma escuta e outra a faixa só é pausada, sem pedir permissão de novo */
let micStream=null,micSrc=null,an=null,an2=null;
async function getMic(){
  const tr=micStream?.getAudioTracks()[0];
  if(tr&&tr.readyState==='live')return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
  micSrc=null;return micStream;
}
function releaseMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;micSrc=null;an=null;an2=null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(recording){stopAll();render(false)}releaseMic()}});
$('micBtn').onclick=async()=>{
  if(recording||stopFn){stopAll();render(false);$('msg').textContent='Parei de ouvir. Toque de novo para recomeçar.';return}
  audio();
  let stream;
  try{stream=await getMic()}
  catch(err){$('msg').textContent='Sem acesso ao microfone. Libere em Ajustes › Safari › Microfone e tente de novo.';return}
  try{if(ctx.state!=='running')await ctx.resume()}catch(e){}
  stream.getAudioTracks().forEach(t=>t.enabled=true);
  if(!micSrc){micSrc=ctx.createMediaStreamSource(stream);
    // filtro como nos afinadores: corta ronco abaixo de 70 Hz e chiado acima de 4 kHz
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4000;
    micSrc.connect(hp).connect(lp);
    an=ctx.createAnalyser();an.fftSize=2048;lp.connect(an);
    an2=ctx.createAnalyser();an2.fftSize=8192;an2.smoothingTimeConstant=.5;lp.connect(an2)}
  reset();recording=true;lockKey=-1;$('micBtn').classList.add('on');$('led').classList.add('on');
  const buf=new Float32Array(an.fftSize),spec=new Float32Array(an2.frequencyBinCount),hist5=[];let nf=.003;polyReset();const t0=ctx.currentTime;let last=t0;
  stopFn=()=>{stream.getAudioTracks().forEach(t=>t.enabled=false)};
  $('msg').textContent='Ouvindo… pode cantar.';
  const tick=()=>{if(!recording)return;
    an.getFloatTimeDomainData(buf);const r=mpm(buf,ctx.sampleRate);
    const now=ctx.currentTime,dt=Math.min(now-last,.1);last=now;
    // ruído de fundo: só aprende com o que claramente não é nota, e devagar
    if(r.f<0||r.clarity<.45)nf=Math.min(.02,nf*.97+r.rms*.03);
    const gate=Math.max(.001,nf*2);
    const ok=r.f>60&&r.f<1400&&r.rms>gate&&r.clarity>=.65;
    let m=null,mf=null,conf=0;
    if(ok){const raw=69+12*Math.log2(r.f/440);
      conf=Math.min(1,Math.max(.4,(r.clarity-.65)/.25));   // leitura limpa vale mais
      refLearn(raw,conf,dt);mf=raw-REF;
      // histerese: fica na nota atual até se afastar 70 cents
      m=(lockN!=null&&Math.abs(mf-lockN)<.7)?lockN:Math.round(mf);lockN=m;}
    else lockN=null;
    curF=ok?r.f:0;
    if(POLY){an2.getFloatFrequencyData(spec);polyFeed(spec,ctx.sampleRate,dt,r.rms>gate);
      if(m==null){runM=null;current=-1}else{runM=m;current=((m%12)+12)%12}}
    else feed(m,dt,conf,mf);
    render(true);
    if(found(now-t0)){done();return}
    loopId=requestAnimationFrame(tick)};
  loopId=requestAnimationFrame(tick);
};
