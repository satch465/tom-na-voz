<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tom na Voz">
<meta name="theme-color" content="#E4E0D6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Tom na Voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: um aparelho só — visor escuro com 1 ou 2 campos de tom, medidor de 12 notas, teclas em pílula embaixo */
:root{
  --bg:#E4E0D6; --surface:#EEEBE3; --ink:#1E1D1A; --muted:#77736A; --line:#CFCABE;
  --accent:#EE6A1F; --accent-ink:#FFF6EE;
  --display:#1C1B19; --display-ink:#EFEADF; --display-dim:#6E6A62;
  --hi:rgba(255,255,255,.75); --lo:rgba(60,50,30,.16);
  --f-ui:"Archivo",system-ui,-apple-system,sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191917; --surface:#232220; --ink:#ECE7DC; --muted:#8C877D; --line:#34322E;
  --display:#0E0E0D; --display-ink:#F1ECE1; --display-dim:#5E5A53;
  --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191917; --surface:#232220; --ink:#ECE7DC; --muted:#8C877D; --line:#34322E;
  --display:#0E0E0D; --display-ink:#F1ECE1; --display-dim:#5E5A53;
  --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.dev{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin:0}
h1 span{color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.screen{background:var(--display);color:var(--display-ink);border-radius:14px;padding:16px;
  box-shadow:inset 2px 2px 6px rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.04);display:flex;flex-direction:column;gap:14px}
.status{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--display-dim)}
.status b{color:var(--display-ink);font-weight:500}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--display-dim);margin-right:7px;vertical-align:1px}
.led.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.one{grid-template-columns:1fr}
.field{border:1px solid #33312D;border-radius:9px;padding:12px 12px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.field .k{font-family:var(--f-mono);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.02em}
.fields.one .field .k{font-size:64px;color:var(--accent)}
.field .n{font-size:13px;color:var(--display-dim)}
.field .n strong{color:var(--display-ink);font-weight:500}
.field.empty .k{color:var(--display-dim)}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.scale span{padding:3px 7px;border-radius:5px;background:#2A2825;color:var(--display-ink)}
.scale span.t{background:var(--accent);color:var(--accent-ink)}
.more{font-family:var(--f-mono);font-size:11px;color:var(--display-dim);letter-spacing:.06em}

.meter{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:5px}
.bar{width:100%;height:46px;background:#262421;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--display-ink);opacity:.85;height:0;transition:height .12s}
.col.in .bar i{background:var(--accent);opacity:1}
.col.now .bar{box-shadow:0 0 0 1px var(--accent)}
.col label{font-family:var(--f-mono);font-size:10px;color:var(--display-dim)}
.col.sig label{color:var(--display-ink)}

.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0;text-align:center;min-height:2.9em;text-wrap:balance}
.mic{width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;margin:6px auto 0;display:grid;place-items:center;color:var(--accent-ink);
  background:radial-gradient(circle at 35% 30%,#FB9455,var(--accent) 60%);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.15),4px 6px 14px var(--lo),0 0 0 9px var(--surface),0 0 0 10px var(--line)}
.mic svg{width:40px;height:40px}
.mic:active{transform:translateY(1px)}
.mic:focus-visible{outline:2px solid var(--accent);outline-offset:14px}
.mic.on{background:radial-gradient(circle at 35% 30%,#3A3834,#1C1B19 65%);color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),4px 6px 14px var(--lo),0 0 0 9px var(--surface),0 0 0 14px var(--accent)}}
.alt{position:relative;align-self:center;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.mic.on{animation:none}}
</style>

</head>
<body>
<div class="dev">
  <header><h1>Tom na Voz<span>.</span></h1><span class="tag">só tons maiores</span></header>

  <section class="screen" aria-live="polite">
    <div class="status"><span><span class="led" id="led"></span><b id="stat">Pronto</b></span><span id="count">—</span></div>
    <div class="fields" id="fields"></div>
    <div class="meter" id="meter"></div>
  </section>

  <button class="mic" id="micBtn" type="button" aria-label="Ouvir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <p class="note" id="msg">Toque no microfone e cante. Ele para sozinho quando achar o tom.</p>
</div>

<script>
const PC=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const KEYS=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const PT=['Dó','Ré♭','Ré','Mi♭','Mi','Fá','Fá♯','Sol','Lá♭','Lá','Si♭','Si'];
const MAJ=[0,2,4,5,7,9,11];
const PROF=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const $=id=>document.getElementById(id);
/* sem zoom: pinça e dois toques */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<320)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

let hist=new Array(12).fill(0), current=-1;

/* ---------- decisão do tom ---------- */
const inKey=(k,pc)=>MAJ.includes((pc-k+12)%12);
function corr(k){
  const x=[...Array(12)].map((_,i)=>hist[(i+k)%12]);
  const mx=x.reduce((a,b)=>a+b)/12, my=PROF.reduce((a,b)=>a+b)/12;
  let n=0,dx=0,dy=0;for(let i=0;i<12;i++){const a=x[i]-mx,b=PROF[i]-my;n+=a*b;dx+=a*a;dy+=b*b}
  return dx&&dy?n/Math.sqrt(dx*dy):0;
}
function significant(){
  const tot=hist.reduce((a,b)=>a+b,0);
  const thr=Math.max(0.18,tot*0.025);
  return hist.map((w,i)=>w>=thr?i:-1).filter(i=>i>=0);
}
function decide(){
  const sig=significant();
  if(!sig.length) return {sig,keys:[],extra:0,approx:false};
  let c=[...Array(12).keys()].filter(k=>sig.every(p=>inKey(k,p)));
  let approx=false;
  if(!c.length){approx=true;c=[...Array(12).keys()]}
  c.sort((a,b)=>corr(b)-corr(a));
  if(approx) c=c.slice(0,1);
  return {sig,keys:c.slice(0,2),extra:Math.max(0,c.length-2),approx};
}
function spell(k){
  const L='CDEFGAB',nat=[0,2,4,5,7,9,11];
  const li=L.indexOf(KEYS[k][0]);
  return MAJ.map((iv,i)=>{const l=(li+i)%7,t=(k+iv)%12;let d=(t-nat[l]+12)%12;if(d>6)d-=12;
    return L[l]+(d===1?'♯':d===-1?'♭':d===2?'𝄪':'')});
}

/* ---------- desenho ---------- */
const meter=$('meter');
PC.forEach((p,i)=>{meter.insertAdjacentHTML('beforeend',`<div class="col" id="c${i}"><div class="bar"><i></i></div><label>${p}</label></div>`)});
function render(live){
  const r=decide(), f=$('fields');
  const max=Math.max(...hist,0.001);
  const inSet=new Set();r.keys.forEach(k=>MAJ.forEach(iv=>inSet.add((k+iv)%12)));
  for(let i=0;i<12;i++){const c=$('c'+i);
    c.querySelector('i').style.height=(hist[i]/max*100)+'%';
    c.classList.toggle('sig',r.sig.includes(i));
    c.classList.toggle('in',r.keys.length===1&&r.sig.includes(i));
    c.classList.toggle('now',i===current);}
  $('count').textContent=r.sig.length?`${r.sig.length} nota${r.sig.length>1?'s':''}`:'—';
  if(!r.keys.length){
    f.className='fields';f.innerHTML=`<div class="field empty"><div class="k">–</div><div class="n">ouvindo…</div></div><div class="field empty"><div class="k">–</div><div class="n">&nbsp;</div></div>`;
    $('stat').textContent=live?'Ouvindo':'Pronto';return;
  }
  if(r.keys.length===1){
    const k=r.keys[0];
    f.className='fields one';
    f.innerHTML=`<div class="field"><div class="k">${KEYS[k]}</div><div class="n"><strong>${PT[k]} maior</strong>${r.approx?' · aproximado, há notas fora da escala':''}</div></div>
      <div class="scale">${spell(k).map((s,i)=>`<span class="${i?'':'t'}">${s}</span>`).join('')}</div>`;
    $('stat').textContent=r.approx?'Mais provável':'Tom definido';
  }else{
    f.className='fields';
    f.innerHTML=r.keys.map(k=>`<div class="field"><div class="k">${KEYS[k]}</div><div class="n"><strong>${PT[k]} maior</strong></div></div>`).join('')
      +(r.extra?`<div class="more">+${r.extra} outro${r.extra>1?'s':''} possíve${r.extra>1?'is':'l'} · continue cantando</div>`:'');
    $('stat').textContent='Ambíguo';
  }
}

/* ---------- detecção de altura (YIN) ---------- */
function yin(buf,sr){
  const W=Math.floor(buf.length/2),tMin=Math.floor(sr/1000),tMax=Math.min(W-1,Math.ceil(sr/65));
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);
  const d=new Float32Array(tMax+1);
  for(let t=1;t<=tMax;t++){let s=0;for(let i=0;i<W;i++){const v=buf[i]-buf[i+t];s+=v*v}d[t]=s}
  let run=0;const c=new Float32Array(tMax+1);c[0]=1;
  for(let t=1;t<=tMax;t++){run+=d[t];c[t]=run?d[t]*t/run:1}
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){if(c[t]<0.15){while(t+1<=tMax&&c[t+1]<c[t])t++;tau=t;break}}
  if(tau<0) return {f:-1,rms};
  const a=c[tau-1]??c[tau],b=c[tau],e=c[tau+1]??c[tau],den=a+e-2*b;
  const tt=den?tau+(a-e)/(2*den):tau;
  return {f:sr/tt,rms};
}
const toMidi=f=>Math.round(69+12*Math.log2(f/440));
function median(a){const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]}

/* ---------- motor de tempo comum ---------- */
let ctx=null, loopId=0, stopFn=null;
function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function stopAll(){cancelAnimationFrame(loopId);if(stopFn){stopFn();stopFn=null}current=-1;$('led').classList.remove('on');
  $('micBtn').classList.remove('on');recording=false}
function reset(){hist.fill(0);current=-1}
let lockKey=-1,lockT=0;
function found(t){ // tom isolado e estável por 1,5 s
  const r=decide();const k=r.keys.length===1&&!r.approx?r.keys[0]:-1;
  if(k!==lockKey){lockKey=k;lockT=t;return false}
  return k>=0&&t-lockT>=1.5;
}
function done(){stopAll();render(false);const k=decide().keys[0];
  $('msg').textContent=`Achei: ${PT[k]} maior. Toque no microfone para ouvir outra melodia.`}
function runTimeline(midiAt,dur,label,onEnd){
  const t0=ctx.currentTime;let last=0;lockKey=-1;$('led').classList.add('on');
  const tick=()=>{const t=ctx.currentTime-t0;const dt=Math.min(t-last,.1);last=t;
    const m=midiAt(t);current=m==null?-1:((m%12)+12)%12;if(m!=null&&dt>0)hist[current]+=dt;
    render(true);
    if(found(t)){done();return}
    if(t<dur)loopId=requestAnimationFrame(tick);else{stopAll();render(false);onEnd&&onEnd()}};
  $('stat').textContent=label;loopId=requestAnimationFrame(tick);
}

render(false);

/* ---------- microfone ---------- */
let recording=false;
$('micBtn').onclick=async()=>{
  if(recording||stopFn){stopAll();render(false);$('msg').textContent='Parei de ouvir. Toque de novo para recomeçar.';return}
  audio();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(err){$('msg').textContent='Sem acesso ao microfone. Libere em Ajustes › Safari › Microfone e tente de novo.';return}
  reset();recording=true;lockKey=-1;$('micBtn').classList.add('on');$('led').classList.add('on');
  const srcN=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=2048;srcN.connect(an);
  const buf=new Float32Array(an.fftSize),hist5=[];const t0=ctx.currentTime;let last=t0;
  stopFn=()=>{stream.getTracks().forEach(t=>t.stop());srcN.disconnect()};
  $('msg').textContent='Ouvindo… pode cantar.';
  const tick=()=>{if(!recording)return;
    an.getFloatTimeDomainData(buf);const r=yin(buf,ctx.sampleRate);
    const now=ctx.currentTime,dt=Math.min(now-last,.1);last=now;
    const m=r.f>60&&r.f<1100&&r.rms>.01?toMidi(r.f):null;
    hist5.push(m);if(hist5.length>5)hist5.shift();
    const ok=hist5.filter(v=>v!=null);const mm=ok.length>=3?median(ok):null;
    current=mm==null?-1:mm%12;if(mm!=null)hist[current]+=dt;
    render(true);
    if(found(now-t0)){done();return}
    loopId=requestAnimationFrame(tick)};
  loopId=requestAnimationFrame(tick);
};
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
